services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
    volumes: [postgres-db-volume:/var/lib/postgresql/data]
  airflow-init:
    build:
      context: ..
      dockerfile: airflow/docker/Dockerfile
    depends_on: {postgres: {condition: service_healthy}}
    env_file:
      - path: .env
        required: false
    command: db migrate
  airflow-webserver:
    build:
      context: ..
      dockerfile: airflow/docker/Dockerfile
    depends_on: {airflow-init: {condition: service_completed_successfully}}
    env_file:
      - path: .env
        required: false
    ports: ["8080:8080"]
    volumes: [./dags:/opt/airflow/dags, ./logs:/opt/airflow/logs]
    command: webserver
  airflow-scheduler:
    build:
      context: ..
      dockerfile: airflow/docker/Dockerfile
    depends_on: {airflow-init: {condition: service_completed_successfully}}
    env_file:
      - path: .env
        required: false
    volumes: [./dags:/opt/airflow/dags, ./logs:/opt/airflow/logs]
    command: scheduler
volumes:
  postgres-db-volume:

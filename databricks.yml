bundle:
  name: conversas-ia

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalogo:
    default: conversas_dev
  versao:
    description: Versão do pacote publicada no job

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${env.DATABRICKS_HOST}
    variables:
      catalogo: conversas_dev
  hml:
    workspace:
      host: ${env.DATABRICKS_HOST}
    variables:
      catalogo: conversas_hml
  prd:
    workspace:
      host: ${env.DATABRICKS_HOST}
    variables:
      catalogo: conversas_prd

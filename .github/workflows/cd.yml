name: CD Databricks
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      executar_job:
        description: Executar o job batch após o deploy
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]" build
      - name: Verificar credenciais Databricks
        id: credenciais
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          disponivel=true
          if [[ -z "$DATABRICKS_HOST" ]]; then
            echo "Credencial ausente: DATABRICKS_HOST (configure como Variable ou Secret)."
            disponivel=false
          fi
          if [[ -z "$DATABRICKS_TOKEN" ]]; then
            echo "Credencial ausente: DATABRICKS_TOKEN (configure como Secret)."
            disponivel=false
          fi
          if [[ "$disponivel" == true ]]; then
            printf 'DATABRICKS_HOST=%s\n' "$DATABRICKS_HOST" >> "$GITHUB_ENV"
            printf 'DATABRICKS_TOKEN=%s\n' "$DATABRICKS_TOKEN" >> "$GITHUB_ENV"
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "Deploy pulado por credenciais ausentes."
          fi
      - uses: databricks/setup-cli@v0.236.0
        if: steps.credenciais.outputs.disponivel == 'true'
      - run: databricks bundle deploy -t prd --var databricks_host="$DATABRICKS_HOST" --var versao="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
        if: steps.credenciais.outputs.disponivel == 'true'
      - name: Executar job batch sob demanda
        if: >-
          steps.credenciais.outputs.disponivel == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.executar_job == true
        run: databricks bundle run job_conversas_ia -t prd --var databricks_host="$DATABRICKS_HOST" --var versao="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

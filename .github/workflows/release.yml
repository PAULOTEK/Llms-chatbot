name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar versão e notas
        id: metadata
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/changelog.py --version "$VERSION" > release-notes.md
      - name: Encerrar se tag já existir
        id: tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Construir wheel
        if: steps.tag.outputs.existe == 'false'
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Criar tag anotada
        if: steps.tag.outputs.existe == 'false'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
      - name: Criar GitHub Release
        if: steps.tag.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh release create "v${VERSION}" dist/*.whl --verify-tag --title "v${VERSION}" --notes-file release-notes.md

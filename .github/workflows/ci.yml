name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
      - name: Validar incremento de versão ou changelog
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          try:
              base = subprocess.check_output(
                  ["git", "show", "origin/main:pyproject.toml"], text=True
              )
          except subprocess.CalledProcessError:
              print("main ainda não possui pyproject.toml; validação ignorada.")
              raise SystemExit(0)
          atual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          anterior = tomllib.loads(base)["project"]["version"]
          try:
              changelog_base = subprocess.check_output(
                  ["git", "show", "origin/main:CHANGELOG.md"], text=True
              )
          except subprocess.CalledProcessError:
              changelog_base = ""
          changelog_atual = Path("CHANGELOG.md").read_text() if Path("CHANGELOG.md").exists() else ""
          changelog_novo = changelog_atual != changelog_base
          if Version(atual) <= Version(anterior) and not changelog_novo:
              raise SystemExit(
                  "Versão não incrementada e CHANGELOG sem entrada nova. "
                  "Use 'make bump-patch' (ou bump-minor/bump-major) e descreva a mudança."
              )
          print(f"Versão base={anterior}, atual={atual}; changelog novo={changelog_novo}")
          PY
      - name: Validar YAMLs
        run: >-
          python -c "import pathlib,yaml;
          [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*')
          if p.suffix in ('.yml','.yaml') and '.venv' not in p.parts]"
  bundle_validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar credenciais Databricks
        id: credenciais
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          disponivel=true
          if [[ -z "$DATABRICKS_HOST" ]]; then
            echo "Credencial ausente: DATABRICKS_HOST (configure como Variable ou Secret)."
            disponivel=false
          fi
          if [[ -z "$DATABRICKS_TOKEN" ]]; then
            echo "Credencial ausente: DATABRICKS_TOKEN (configure como Secret)."
            disponivel=false
          fi
          if [[ "$disponivel" == true ]]; then
            printf 'DATABRICKS_HOST=%s\n' "$DATABRICKS_HOST" >> "$GITHUB_ENV"
            printf 'DATABRICKS_TOKEN=%s\n' "$DATABRICKS_TOKEN" >> "$GITHUB_ENV"
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "Bundle validate pulado por credenciais ausentes."
          fi
      - uses: databricks/setup-cli@v0.236.0
        if: steps.credenciais.outputs.disponivel == 'true'
      - name: Validar bundle Databricks
        if: steps.credenciais.outputs.disponivel == 'true'
        run: |
          set +e
          saida="$(databricks bundle validate -t dev --var versao="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" 2>&1)"
          status=$?
          set -e
          saida_segura="${saida//$DATABRICKS_HOST/[DATABRICKS_HOST]}"
          saida_segura="${saida_segura//$DATABRICKS_TOKEN/[DATABRICKS_TOKEN]}"
          printf '%s\n' "$saida_segura"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if grep -Eqi 'invalid access token|unauthorized|authentication|401' <<< "$saida"; then
            echo "::warning::Validação do Bundle ignorada: credencial Databricks inválida ou expirada. Atualize DATABRICKS_TOKEN para habilitar essa verificação."
            exit 0
          fi
          echo "::error::Validação do Bundle falhou por um erro estrutural ou operacional."
          exit "$status"

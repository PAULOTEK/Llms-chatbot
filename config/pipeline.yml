lgpd:
  salt_env: CONVERSAS_PII_SALT
  anonimizacao_modo: nativo
  anonimizar: true
  detectar_nomes: true
qualidade:
  severidade_falha: critica
  permitir_quarentena: true
datasets:
  minimo_turnos: 2
  splits: {treino: 0.8, validacao: 0.1, teste: 0.1}
  idiomas: [pt]
streaming:
  trigger: availableNow
  watermark: 10 minutes
  checkpoints:
    bronze: /Volumes/workspace/bronze/checkpoints/kafka_bronze
    silver: /Volumes/workspace/bronze/checkpoints/silver_streaming

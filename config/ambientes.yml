dev:
  catalogo: conversas_dev
  schemas: {bronze: bronze, silver: silver, gold: gold, governanca: governanca}
  paths: {landing: /Volumes/conversas_dev/landing, checkpoint: /Volumes/conversas_dev/checkpoints}
  jdbc: {url: jdbc:postgresql://localhost:5432/conversas, tabela: public.atendimentos}
  kafka:
    bootstrap_servers: kafka:9092
    topic: conversas
    starting_offsets: latest
    max_offsets_per_trigger: 1000
    security_protocol: PLAINTEXT
hml:
  catalogo: conversas_hml
  schemas: {bronze: bronze, silver: silver, gold: gold, governanca: governanca}
  paths: {landing: /Volumes/conversas_hml/landing, checkpoint: /Volumes/conversas_hml/checkpoints}
  jdbc: {url: jdbc:postgresql://localhost:5432/conversas, tabela: public.atendimentos}
  kafka:
    bootstrap_servers: kafka-hml:9093
    topic: conversas
    starting_offsets: latest
    max_offsets_per_trigger: 5000
    security_protocol: SASL_SSL
    sasl_mechanism: PLAIN
    sasl_jaas_config: ${KAFKA_SASL_JAAS_CONFIG}
prd:
  catalogo: conversas_prd
  schemas: {bronze: bronze, silver: silver, gold: gold, governanca: governanca}
  paths: {landing: /Volumes/conversas_prd/landing, checkpoint: /Volumes/conversas_prd/checkpoints}
  jdbc: {url: jdbc:postgresql://localhost:5432/conversas, tabela: public.atendimentos}
  kafka:
    bootstrap_servers: kafka-prd:9093
    topic: conversas
    starting_offsets: latest
    max_offsets_per_trigger: 10000
    security_protocol: SASL_SSL
    sasl_mechanism: PLAIN
    sasl_jaas_config: ${KAFKA_SASL_JAAS_CONFIG}

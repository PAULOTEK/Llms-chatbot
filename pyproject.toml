[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversas-ia"
version = "0.0.2"
description = "Lakehouse conversacional para preparação de dados de LLM"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4", "PyYAML>=6", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["black>=24", "build>=1", "pytest>=8", "ruff>=0.6"]
streaming = ["kafka-python>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"airflow/dags/*.py" = ["I001"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"

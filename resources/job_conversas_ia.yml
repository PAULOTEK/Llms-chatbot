resources:
  jobs:
    job_conversas_ia:
      name: conversas-ia-diario
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      parameters:
        - name: ambiente
          default: ${bundle.target}
        - name: data_execucao
          default: "{{job.start_time.iso_date}}"
      email_notifications:
        on_failure:
          - dados@exemplo.com
      tasks:
        - task_key: ingestao_bronze
          notebook_task:
            notebook_path: ../notebooks/01_ingestao_bronze.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}"}
          environment_key: serverless
        - task_key: silver_normalizacao_lgpd
          depends_on: [{task_key: ingestao_bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver_normalizacao_lgpd.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}"}
          environment_key: serverless
        - task_key: qualidade_quarentena
          depends_on: [{task_key: silver_normalizacao_lgpd}]
          notebook_task:
            notebook_path: ../notebooks/03_qualidade_quarentena.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}"}
          environment_key: serverless
        - task_key: gold_analitico
          depends_on: [{task_key: qualidade_quarentena}]
          notebook_task:
            notebook_path: ../notebooks/04_gold_analitico.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}"}
          environment_key: serverless
        - task_key: gold_datasets_ia
          depends_on: [{task_key: gold_analitico}]
          notebook_task:
            notebook_path: ../notebooks/05_gold_datasets_ia.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}"}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            # Client 1 é a versão conservadora documentada para environments
            # de Serverless Jobs; a wheel é instalada uma única vez aqui.
            client: "1"
            dependencies: ["../dist/*.whl"]

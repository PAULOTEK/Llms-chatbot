resources:
  jobs:
    job_conversas_ia:
      name: conversas-ia-diario
      tags: {versao: "${var.versao}"}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      parameters:
        - name: ambiente
          default: ${bundle.target}
        - name: data_execucao
          default: "{{job.start_time.iso_date}}"
        - name: raiz_projeto
          default: ${workspace.file_path}
      email_notifications:
        on_failure:
          - dados@exemplo.com
      tasks:
        - task_key: ingestao_bronze
          notebook_task:
            notebook_path: ../notebooks/01_ingestao_bronze.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}", raiz_projeto: "{{job.parameters.raiz_projeto}}"}
          environment_key: serverless
        - task_key: silver_normalizacao_lgpd
          depends_on: [{task_key: ingestao_bronze}]
          notebook_task:
            notebook_path: ../notebooks/02_silver_normalizacao_lgpd.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}", raiz_projeto: "{{job.parameters.raiz_projeto}}"}
          environment_key: serverless
        - task_key: qualidade_quarentena
          depends_on: [{task_key: silver_normalizacao_lgpd}]
          notebook_task:
            notebook_path: ../notebooks/03_qualidade_quarentena.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}", raiz_projeto: "{{job.parameters.raiz_projeto}}"}
          environment_key: serverless
        - task_key: gold_analitico
          depends_on: [{task_key: qualidade_quarentena}]
          notebook_task:
            notebook_path: ../notebooks/04_gold_analitico.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}", raiz_projeto: "{{job.parameters.raiz_projeto}}"}
          environment_key: serverless
        - task_key: gold_datasets_ia
          depends_on: [{task_key: gold_analitico}]
          notebook_task:
            notebook_path: ../notebooks/05_gold_datasets_ia.py
            base_parameters: {ambiente: "{{job.parameters.ambiente}}", data_execucao: "{{job.parameters.data_execucao}}", raiz_projeto: "{{job.parameters.raiz_projeto}}"}
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            # Client 2 é o canal recomendado para Serverless Jobs; Client 1
            # falha em workspaces que não suportam o canal de REPL legado.
            client: "2"
            dependencies: ["../dist/*.whl"]
    job_conversas_ia_streaming:
      name: conversas-ia-streaming-available-now
      tags: {versao: "${var.versao}"}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      parameters:
        - name: ambiente
          default: ${bundle.target}
        - name: data_execucao
          default: "{{job.start_time.iso_date}}"
        - name: raiz_projeto
          default: ${workspace.file_path}
      email_notifications:
        on_failure:
          - dados@exemplo.com
      tasks:
        - task_key: streaming_bronze_kafka
          notebook_task:
            notebook_path: ../notebooks/06_streaming_bronze_kafka.py
            base_parameters:
              ambiente: "{{job.parameters.ambiente}}"
              data_execucao: "{{job.parameters.data_execucao}}"
              raiz_projeto: "{{job.parameters.raiz_projeto}}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            # Client 2 é o canal recomendado para Serverless Jobs.
            client: "2"
            dependencies: ["../dist/*.whl"]
